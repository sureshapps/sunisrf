<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUN MEDIA - Stationery Request</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="landing-page">
    <div class="landing-container">
        <div class="company-header">
            <h1>SUN MEDIA CORPORATION SDN BHD</h1>
            <p class="subtitle">Internal Stationery Request System</p>
        </div>
        
        <div class="quote-section">
            <i class="fas fa-quote-left quote-icon"></i>
            <blockquote>
                "Everything we use is our responsibility. 
                <br>Take only what you need, use it wisely."
            </blockquote>
            <i class="fas fa-quote-right quote-icon"></i>
        </div>

        <div class="features-preview">
            <div class="feature">
                <i class="fas fa-pen"></i>
                <span>Request Stationery</span>
            </div>
            <div class="feature">
                <i class="fas fa-clock"></i>
                <span>Collection: 10AM - 4PM</span>
            </div>
            <div class="feature">
                <i class="fas fa-check-circle"></i>
                <span>Quick Approval</span>
            </div>
        </div>

        <button class="btn-get-started" onclick="window.location.href='request.html'">
            <i class="fas fa-play-circle"></i> Get Started
        </button>

        <div class="admin-link">
            <a href="admin-login.html">
                <i class="fas fa-lock"></i> Admin Portal
            </a>
        </div>
    </div>

    <script src="js/app.js"></script>

</html>
